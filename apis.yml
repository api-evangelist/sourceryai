name: Sourcery.AI
description: >-
  Sourcery is an AI-powered code review platform built for teams shipping large
  volumes of AI-generated and human-written code. It delivers instant automated
  pull-request reviews with summaries, diagrams, and line-by-line suggestions,
  continuous security scanning (SAST, SCA, secrets, IaC, and license detection),
  team analytics, and real-time in-IDE review feedback. Sourcery integrates with
  GitHub, GitLab, VS Code, Cursor, and JetBrains IDEs, and works alongside coding
  agents to automatically fix the issues it identifies. The company also maintains
  the open-source Sourcery Python refactoring CLI and the sourcery-analytics code
  quality toolkit. Sourcery is SOC 2 and GDPR compliant, with enterprise options
  for self-hosting, zero data retention, custom LLM endpoints, and no training on
  customer code.
